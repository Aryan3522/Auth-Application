<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home</title>

    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #f5f5f5;
        font-family: Arial, sans-serif;
      }

      /* HEADER */
      .container {
        display: flex;
        padding: 12px 40px;
        justify-content: space-between;
        align-items: center;
      }

      h1 {
        font-size: clamp(12px, 3.5vw, 34px);
        font-weight: 700;
        margin: 0;
        line-height: 1.2;
      }

      /* AVATAR WRAPPER */
      .avatar-wrapper {
        position: relative;
        cursor: pointer;
      }

      /* AVATAR CIRCLE */
      .avatar {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: #171717;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 600;
        font-size: 16px;
        transition: background 0.2s ease;
      }

      .avatar:hover {
        background: #130068;
      }

      /* DROPDOWN MENU */
      .dropdown {
        position: absolute;
        right: 0;
        top: 55px;
        background: #ffffff;
        border-radius: 8px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        min-width: 180px;
        overflow: hidden;
        opacity: 0;
        transform: translateY(-10px);
        pointer-events: none;
        transition: all 0.25s ease;
        z-index: 1000;
      }

      /* SHOW STATE */
      .dropdown.show-dropdown {
        opacity: 1;
        transform: translateY(0);
        pointer-events: auto;
      }

      /* DROPDOWN BUTTONS */
      .dropdown button {
        width: 100%;
        padding: 12px 16px;
        border: none;
        background: white;
        cursor: pointer;
        text-align: left;
        font-size: 14px;
        transition: background 0.2s ease;
      }

      .dropdown button:hover {
        background: #f2f2f2;
      }

      .dropdown button:first-child {
        color: #dc3545;
      }

      .dropdown button:last-child {
        color: #171717;
      }

      /* STATUS */
      .status-badge {
        margin-left: 15px;
        padding: 8px 16px;
        border-radius: 20px;
        font-weight: 600;
        font-size: 14px;
      }

      .active {
        background-color: #28a745;
        color: white;
      }

      .inactive {
        background-color: #dc3545;
        color: white;
      }

      /* USERS */
      .users-section {
        padding: 0 40px 120px 40px; /* space for fixed button */
      }

      .user-card {
        background: white;
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .user-info {
        display: flex;
        flex-direction: column;
      }

      /* FIXED TOGGLE BUTTON */
      #toggleStatusBtn {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        padding: 18px 40px;
        border-radius: 50px;
        border: none;
        background-color: #171717;
        color: #fff;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        z-index: 1000;
        min-width: 260px;
        max-width: fit-content;
      }

      #toggleStatusBtn:hover {
        background-color: #130068;
      }

      /* SNACKBAR */
      .snackbar {
        position: fixed;
        bottom: 20px;
        right: 20px;
        min-width: 280px;
        max-width: 350px;
        background: #1e1e1e;
        color: #fff;
        padding: 14px 18px 18px 18px;
        border-radius: 8px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        font-weight: 500;
        font-size: 14px;
        opacity: 0;
        transform: translateY(-20px);
        transition: all 0.3s ease;
        overflow: hidden;
        z-index: 9999;
      }

      .snackbar.show {
        opacity: 1;
        transform: translateY(0);
      }

      .snackbar-progress {
        position: absolute;
        bottom: 0;
        left: 0;
        height: 4px;
        background: #4caf50;
        width: 100%;
        transition: width linear;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>User Status Dashboard</h1>

      <div style="display: flex; align-items: center; gap: 15px">
        <span id="globalStatus" class="status-badge inactive">Unknown</span>

        <div class="avatar-wrapper" id="avatarWrapper">
          <div class="avatar">U</div>
          <div class="dropdown" id="dropdownMenu">
            <button id="deleteAccountBtn">Delete Account</button>
            <button id="logoutBtn">Logout</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Snackbar -->
    <div id="responseMsg" class="snackbar">
      <span id="responseText"></span>
      <div class="snackbar-progress"></div>
    </div>

    <div class="users-section">
      <h2>All Users</h2>
      <div id="usersContainer"></div>
    </div>

    <!-- Fixed Toggle Button -->
    <button id="toggleStatusBtn">Toggle All Users Status</button>

    <script>
      document.getElementById("logoutBtn").addEventListener("click", () => {
        // Clear token
        localStorage.removeItem("token");

        // Optional: clear any cached data
        localStorage.clear();

        // Redirect to login page
        window.location.href = "/login";
      });

      const DAY_MAP = {
        0: "Sunday",
        1: "Monday",
        2: "Tuesday",
        3: "Wednesday",
        4: "Thursday",
        5: "Friday",
        6: "Saturday",
      };

      const avatarWrapper = document.getElementById("avatarWrapper");
      const dropdown = document.getElementById("dropdownMenu");

      // Toggle dropdown
      avatarWrapper.addEventListener("click", (e) => {
        e.stopPropagation();
        dropdown.classList.toggle("show-dropdown");
      });

      // Close when clicking outside
      document.addEventListener("click", () => {
        dropdown.classList.remove("show-dropdown");
      });

      function showMessage(message, isError = false) {
        const snackbar = document.getElementById("responseMsg");
        const text = document.getElementById("responseText");
        const progress = snackbar.querySelector(".snackbar-progress");

        text.innerText = message;

        // Change color based on error/success
        snackbar.style.background = isError ? "#dc3545" : "#1e1e1e";
        progress.style.background = isError ? "#ffb3b3" : "#4caf50";

        snackbar.classList.add("show");

        // Reset progress
        progress.style.transition = "none";
        progress.style.width = "100%";

        setTimeout(() => {
          progress.style.transition = "width 3s linear";
          progress.style.width = "0%";
        }, 50);

        // Clear previous timer
        if (snackbar.hideTimeout) {
          clearTimeout(snackbar.hideTimeout);
        }

        snackbar.hideTimeout = setTimeout(() => {
          snackbar.classList.remove("show");
        }, 3000);
      }

      const token = localStorage.getItem("token");
      if (!token) {
        alert("Please login first");
        window.location.href = "/login";
      }

      const usersContainer = document.getElementById("usersContainer");
      const globalStatus = document.getElementById("globalStatus");

      async function fetchUsers() {
        try {
          const res = await fetch("/api/users", {
            headers: {
              Authorization: `Bearer ${token}`,
            },
          });

          const data = await res.json();
          if (!res.ok) throw new Error(data.message);

          usersContainer.innerHTML = "";

          if (!data.users.length) {
            usersContainer.innerHTML = "<p>No users found.</p>";
            return;
          }

          // Determine global status consistency
          const firstStatus = data.users[0].status;
          const allSame = data.users.every((u) => u.status === firstStatus);

          globalStatus.innerText = allSame
            ? firstStatus.toUpperCase()
            : "Mixed";
          globalStatus.className =
            "status-badge " +
            (firstStatus === "active" ? "active" : "inactive");

          data.users.forEach((user) => {
            const div = document.createElement("div");
            div.className = "user-card";

            div.innerHTML = `
        <div class="user-info">
          <strong>${user.name}</strong>
          <small>${user.email}</small>
          <small>${user.address}</small>
          <small>Registered Day: ${user.registeredDay} (${DAY_MAP[user.registeredDay] || "Invalid"})</small>
        </div>
        <span class="status-badge ${user.status}">
          ${user.status.toUpperCase()}
        </span>
      `;

            usersContainer.appendChild(div);
          });
        } catch (err) {
          showMessage(err.message, true);
        }
      }

      document
        .getElementById("deleteAccountBtn")
        .addEventListener("click", async () => {
          if (
            !confirm(
              "Are you sure you want to delete your account? This action cannot be undone.",
            )
          )
            return;

          try {
            const res = await fetch("/api/users/delete-account", {
              method: "DELETE",
              headers: {
                Authorization: `Bearer ${localStorage.getItem("token")}`,
              },
            });

            const result = await res.json();
            console.log(result);

            if (!res.ok) throw new Error(result.message);

            localStorage.removeItem("token");
            showMessage(result.message, true);

            window.location.href = "/register";
          } catch (err) {
            showMessage(err.message, true);
          }
        });
      document
        .getElementById("toggleStatusBtn")
        .addEventListener("click", async () => {
          try {
            const res = await fetch("/api/users/toggle-status", {
              method: "POST",
              headers: {
                Authorization: `Bearer ${token}`,
                "Content-Type": "application/json",
              },
            });

            const result = await res.json();
            if (!res.ok) throw new Error(result.message);

            showMessage(result.message);

            await fetchUsers();
          } catch (err) {
            showMessage(err.message, true);
          }
        });

      // Load users on page load
      fetchUsers();
    </script>
  </body>
</html>
