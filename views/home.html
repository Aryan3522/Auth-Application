<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home</title>

    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #f5f5f5;
        font-family: Arial, sans-serif;
      }

      .container {
        display: flex;
        padding: 12px 40px;
        justify-content: space-between;
        align-items: center;
      }

      #toggleStatusBtn {
        padding: 20px 40px;
        border-radius: 8px;
        border: 1px solid #171717;
        background-color: #171717;
        color: #f5f5f5;
        font-weight: 600;
        cursor: pointer;
      }

      #toggleStatusBtn:hover {
        background-color: #130068;
      }

      .status-badge {
        margin-left: 15px;
        padding: 8px 16px;
        border-radius: 20px;
        font-weight: 600;
        font-size: 14px;
      }

      .active {
        background-color: #28a745;
        color: white;
      }

      .inactive {
        background-color: #dc3545;
        color: white;
      }

      .users-section {
        padding: 0 40px 40px 40px;
      }

      .user-card {
        background: white;
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .user-info {
        display: flex;
        flex-direction: column;
      }
      .snackbar {
        position: fixed;
        bottom: 20px;
        right: 20px;
        min-width: 280px;
        max-width: 350px;
        background: #1e1e1e;
        color: #fff;
        padding: 14px 18px 18px 18px;
        border-radius: 8px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        font-weight: 500;
        font-size: 14px;
        opacity: 0;
        transform: translateY(-20px);
        transition: all 0.3s ease;
        overflow: hidden;
        z-index: 9999;
      }

      .snackbar.show {
        opacity: 1;
        transform: translateY(0);
      }

      .snackbar-progress {
        position: absolute;
        bottom: 0;
        left: 0;
        height: 4px;
        background: #4caf50;
        width: 100%;
        transition: width linear;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>Click this button to toggle the user's status.</h1>
      <div>
        <button id="toggleStatusBtn">Toggle All Users Status</button>
        <span id="globalStatus" class="status-badge inactive">Unknown</span>
      </div>
    </div>

    <div id="responseMsg" class="snackbar">
      <span id="responseText"></span>
      <div class="snackbar-progress"></div>
    </div>

    <div class="users-section">
      <h2>All Users</h2>
      <div id="usersContainer"></div>
    </div>

    <script>
      const token = localStorage.getItem("token");
      function showMessage(message, isError = false) {
        const snackbar = document.getElementById("responseMsg");
        const text = document.getElementById("responseText");
        const progress = snackbar.querySelector(".snackbar-progress");

        text.innerText = message;

        // Change color based on error/success
        snackbar.style.background = isError ? "#dc3545" : "#1e1e1e";
        progress.style.background = isError ? "#ffb3b3" : "#4caf50";

        snackbar.classList.add("show");

        // Reset progress
        progress.style.transition = "none";
        progress.style.width = "100%";

        setTimeout(() => {
          progress.style.transition = "width 3s linear";
          progress.style.width = "0%";
        }, 50);

        // Clear previous timer
        if (snackbar.hideTimeout) {
          clearTimeout(snackbar.hideTimeout);
        }

        snackbar.hideTimeout = setTimeout(() => {
          snackbar.classList.remove("show");
        }, 3000);
      }

      if (!token) {
        alert("Please login first");
        window.location.href = "/login";
      }

      const usersContainer = document.getElementById("usersContainer");
      const globalStatus = document.getElementById("globalStatus");

      async function fetchUsers() {
        try {
          const res = await fetch("/api/users", {
            headers: {
              Authorization: `Bearer ${token}`,
            },
          });

          const data = await res.json();
          if (!res.ok) throw new Error(data.message);

          usersContainer.innerHTML = "";

          if (!data.users.length) {
            usersContainer.innerHTML = "<p>No users found.</p>";
            return;
          }

          // Determine global status consistency
          const firstStatus = data.users[0].status;
          const allSame = data.users.every((u) => u.status === firstStatus);

          globalStatus.innerText = allSame
            ? firstStatus.toUpperCase()
            : "Mixed";
          globalStatus.className =
            "status-badge " +
            (firstStatus === "active" ? "active" : "inactive");

          data.users.forEach((user) => {
            const div = document.createElement("div");
            div.className = "user-card";

            div.innerHTML = `
        <div class="user-info">
          <strong>${user.name}</strong>
          <small>${user.email}</small>
          <small>${user.address}</small>
          <small>Lat: ${user.latitude} | Lng: ${user.longitude}</small>
          <small>Registered Day: ${user.registeredDay}</small>
        </div>
        <span class="status-badge ${user.status}">
          ${user.status.toUpperCase()}
        </span>
      `;

            usersContainer.appendChild(div);
          });
        } catch (err) {
          showMessage(err.message, true);
        }
      }

      document
        .getElementById("toggleStatusBtn")
        .addEventListener("click", async () => {
          try {
            const res = await fetch("/api/users/toggle-status", {
              method: "POST",
              headers: {
                Authorization: `Bearer ${token}`,
                "Content-Type": "application/json",
              },
            });

            const result = await res.json();
            if (!res.ok) throw new Error(result.message);

            showMessage(result.message);

            await fetchUsers();
          } catch (err) {
            showMessage(err.message, true);
          }
        });

      // Load users on page load
      fetchUsers();
    </script>
  </body>
</html>
