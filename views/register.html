<!doctype html>
<html>
  <head>
    <title>User Registration</title>
    <style>
      body {
        background-color: #eee;
      }
      .container {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        width: 100%;
      }
      form {
        display: flex;
        flex-direction: column;
        gap: 8px;
        width: 400px;
      }
      input,
      button {
        padding: 14px 12px;
        border-radius: 8px;
        border: 1px solid #171717;
      }
      button {
        background: #000;
        color: #fff;
        cursor: pointer;
      }
      #message {
        margin-top: 10px;
        font-size: 14px;
      }
      #login {
        width: 400px;
        margin-top: 8px;
      }
      /* SNACKBAR */
      .snackbar {
        position: fixed;
        bottom: 20px;
        right: 20px;
        min-width: 280px;
        max-width: 350px;
        background: #1e1e1e;
        color: #fff;
        padding: 14px 18px 18px 18px;
        border-radius: 8px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        font-weight: 500;
        font-size: 14px;
        opacity: 0;
        transform: translateY(-20px);
        transition: all 0.3s ease;
        overflow: hidden;
        z-index: 9999;
      }

      .snackbar.show {
        opacity: 1;
        transform: translateY(0);
      }

      .snackbar-progress {
        position: absolute;
        bottom: 0;
        left: 0;
        height: 4px;
        background: #4caf50;
        width: 100%;
        transition: width linear;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h2>Register User</h2>
      <p style="padding: 0 40px">
        You Must Allow Location Permissions in order to create your ID
      </p>
      <form id="registerForm">
        <input name="name" placeholder="Name" />
        <input name="email" type="email" placeholder="Email" />
        <input name="password" type="password" placeholder="Password" />
        <input name="address" placeholder="Address" />

        <!-- Hidden fields for location -->
        <input type="hidden" name="latitude" id="latitude" />
        <input type="hidden" name="longitude" id="longitude" />

        <button type="submit">Register</button>
      </form>
      <button id="login">login</button>

      <!-- Snackbar -->
      <div id="responseMsg" class="snackbar">
        <span id="responseText"></span>
        <div class="snackbar-progress"></div>
      </div>
    </div>

    <script>
      function showMessage(message, isError = false) {
        const snackbar = document.getElementById("responseMsg");
        const text = document.getElementById("responseText");
        const progress = snackbar.querySelector(".snackbar-progress");

        text.innerText = message;

        // Change color based on error/success
        snackbar.style.background = isError ? "#dc3545" : "#1e1e1e";
        progress.style.background = isError ? "#ffb3b3" : "#4caf50";

        snackbar.classList.add("show");

        // Reset progress
        progress.style.transition = "none";
        progress.style.width = "100%";

        setTimeout(() => {
          progress.style.transition = "width 3s linear";
          progress.style.width = "0%";
        }, 50);

        // Clear previous timer
        if (snackbar.hideTimeout) {
          clearTimeout(snackbar.hideTimeout);
        }

        snackbar.hideTimeout = setTimeout(() => {
          snackbar.classList.remove("show");
        }, 3000);
      }

      // Get location
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (position) => {
            document.getElementById("latitude").value =
              position.coords.latitude;
            document.getElementById("longitude").value =
              position.coords.longitude;
          },
          () => {
            console.warn("Location permission denied");
            showMessage("Please Allow Location Permissions!", true);
          },
        );
      }

      // Handle form submit
      document
        .getElementById("registerForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const formData = new FormData(e.target);
          const payload = Object.fromEntries(formData.entries());

          try {
            const response = await fetch("/api/register", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify(payload),
            });

            const result = await response.json();

            if (!response.ok) {
              throw new Error(result.message || "Registration failed");
            }

            showMessage(result.message);

            // Redirect to home
            setTimeout(() => {
              window.location.href = "/login";
            }, 800);
          } catch (err) {
            showMessage(err.message, true);
          }
        });
      document.getElementById("login").onclick = () => {
        window.location.href = "/login";
      };
    </script>
  </body>
</html>
